<style>

:root[data-theme="dark"]{--bg:#151a24;--card:#1f2633;--ink:#eef1f7;--mute:#98a2b3;--line:#2f384a;--acc:#6f8cff;--acc-ink:#0f1626;--field:#161c28;--danger:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:130px}
main{max-width:560px;margin:0 auto;padding:16px 14px}
h1,h2,.xn,.tm{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em}
h1{font-size:34px;line-height:1;margin:6px 0 12px}h2{font-size:22px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:8px;align-items:center}.wrap{position:relative;flex:1}
.prev{color:var(--mute);font-size:14px;margin:4px 0 10px}
.cols,.row{display:grid;grid-template-columns:26px 1fr 1fr 40px 36px;gap:8px;align-items:center}
.cols{color:var(--mute);font-size:13px;margin:6px 0 4px;text-align:center}.row{margin-bottom:8px}.row .n{color:var(--mute);font-weight:600;text-align:center}
input,textarea{width:100%;min-height:48px;font:600 20px Barlow,system-ui,sans-serif;text-align:center;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:6px}

input.txt{text-align:left;font-size:17px;padding:6px 12px}
input.nt{text-align:left;font-size:15px;font-weight:500;min-height:40px;margin:0 0 10px;padding:6px 12px}
input.xn{text-align:left;font-size:22px;min-height:44px;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:4px 0}
input.ck{width:28px;min-height:28px;padding:0;justify-self:center;accent-color:var(--acc)}
.row.d input:not(.ck){border-color:var(--acc)}.row.d .n{color:var(--acc)}
textarea{min-height:110px;font:14px/1.4 ui-monospace,Menlo,monospace;text-align:left;margin:8px 0}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{font:600 16px Barlow,system-ui,sans-serif;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.ghost{border:0;background:none;color:var(--mute);min-width:40px;padding:0 8px}button.del{color:var(--danger)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.tools button{min-height:36px;font-size:14px;padding:0 10px}.tools{align-items:center}.grp{display:flex}.grp button{border-radius:0}.grp button:first-child{border-radius:10px 0 0 10px}.grp button:last-child{border-radius:0 10px 10px 0}.sp{flex:1}button.seg[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}button.ok{background:none;color:var(--acc);border-color:var(--acc)}button:disabled{opacity:.35;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.chip{white-space:nowrap;flex:none}.chip[aria-current="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sg{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.2);overflow:hidden}.sg:empty{display:none}
.sg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;font-weight:500}
.empty,.sum{color:var(--mute)}.empty{text-align:center;padding:24px 12px}.full{width:100%;margin-top:4px}
details{border-top:1px solid var(--line);padding:8px 0}summary{font-weight:600;cursor:pointer;min-height:32px}
.ex{margin:4px 0;font-size:15px}.ex b{font-weight:600}
.bi{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:2px 0}.bi span{flex:1}
.st{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.st b{color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;border:0;border-radius:0;min-height:60px;font-size:15px;padding:0 4px;background:none;color:var(--mute)}
nav button[aria-current="page"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#fl{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:9}
#tb,#ts{display:flex;align-items:center;gap:8px;padding:8px 14px}
#tb{background:var(--acc);color:var(--acc-ink)}#tb button{background:none;color:inherit;border-color:currentColor;min-height:36px;padding:0 10px}
.tm{flex:1;font-size:28px}#ts{background:var(--ink);color:var(--bg)}#ts span{flex:1}#ts button{min-height:36px}
.sr{position:absolute;left:-9999px}

    h+='<svg viewBox="0 0 300 80" width="100%" role="img" aria-label="Suurimman painon kehitys" style="margin-top:10px"><polyline points="'+p.join(' ')+'" fill="none" style="stroke:var(--acc)" stroke-width="2.5"/>'+p.map(function(q){return '<circle cx="'+q.split(',')[0]+'" cy="'+q.split(',')[1]+'" r="3.5" style="fill:var(--acc)"/>';}).join('')+'</svg>';
  }
  h+='</div><div class="card">';
  rows.slice().reverse().forEach(function(r){h+='<div class="st"><span>'+esc(fd(r.d))+' (kierto '+r.c+')</span><span>'+f(r.t)+' '+du+' × '+r.r+(r.t===bt?' <b>ennätys</b>':'')+'</span></div>';});
  return h+'</div>';
}

function beep(){try{if(navigator.vibrate)navigator.vibrate([200,100,200]);var A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop();a.close();},350);}catch(e){}}
function arm(b,txt){
  if(b._arm)return true;b._arm=1;b._t=b.textContent;b.textContent=txt;
  setTimeout(function(){b._arm=0;if(b.isConnected)b.textContent=b._t;},3000);return false;

function tsv(){
  var mx=1;S.cycles.forEach(function(c){c.wk.forEach(function(w){w.ex.forEach(function(e){if(e.sets.length>mx)mx=e.sets.length;});});});
  var h=['Kierto','Treeni','Päivä','Liike','Yksikkö'];for(var i=1;i<=mx;i++){h.push(i+'. toistot');h.push(i+'. painot');}
  var L=[h.join('\t')],c=function(v){return String(v).replace(/[\t\n\r]/g,' ').replace('.',',');};
  S.cycles.forEach(function(cy,ci){cy.wk.forEach(function(w){w.ex.forEach(function(e){
    var r=[ci+1,w.name,w.date,e.name,U(e)];
    for(var i=0;i<mx;i++){var s=e.sets[i];r.push(s?c(s.reps):'');r.push(s?c(s.kg):'');}
    L.push(r.map(function(x){return String(x).replace(/[\t\n\r]/g,' ');}).join('\t'));
  });});});
  return L.join('\n');
}

  else if(a==='prog'){pn=b.dataset.n;view='prog';render();window.scrollTo(0,0);}
  else if(a==='newc'){if(arm(b,'Vahvista: uusi kierto alkaa')){S.cycles.push(cp(c));aw=0;save();render();window.scrollTo(0,0);}}
  else if(a==='addb'){addB();}

  }
});
